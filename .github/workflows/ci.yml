name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    name: Lint and test (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (fails below the coverage thresholds in vitest.config.js)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage

  migrations:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iap
          POSTGRES_PASSWORD: iap
          POSTGRES_DB: iap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://iap:iap@localhost:5432/iap
      JWT_SECRET: ci-only-secret-not-used-in-production
      BCRYPT_ROUNDS: 4
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Apply migrations
        run: npm run migrate

      - name: Migrations are re-runnable
        run: npm run migrate

      - name: Seed the first administrator
        run: npm run seed:admin
